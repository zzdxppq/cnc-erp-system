epic_id: 1
title: "Foundation & Core Infrastructure"
description: |
  建立项目基础架构。系统服务提供用户管理、权限控制、工作流引擎、数据字典等基础能力。
  API网关统一处理路由、认证鉴权、日志记录。数据库设计遵循模块化原则，为后续业务扩展预留空间。
  CI/CD确保代码质量，基础代码生成提升开发效率。

stories:
  - id: "1.1"
    title: "System Service - User Management & Authentication"
    repository_type: monolith
    estimated_complexity: medium
    priority: P0

    acceptance_criteria:
      - id: AC1
        title: "User registration and JWT authentication"
        scenario:
          given: "User is not registered in the system"
          when: "User submits valid registration data via POST /api/auth/register"
          then:
            - "New user record is created in database"
            - "Password is hashed using bcrypt with cost factor 12"
            - "Response returns 201 with user object (excluding password)"
            - "JWT access token is generated (15 min expiry)"

        business_rules:
          - id: "BR-1.1"
            rule: "Email must be unique across all users"
          - id: "BR-1.2"
            rule: "Password must be 8-32 characters with at least one uppercase, one lowercase, and one digit"
          - id: "BR-1.3"
            rule: "New accounts are created with status 'active'"

        data_validation:
          - field: "email"
            type: "email"
            required: true
            rules: "RFC 5322 compliant, max 255 characters"
            error_message: "请输入有效的邮箱地址"
          - field: "password"
            type: "string"
            required: true
            rules: "8-32 chars, must contain [A-Z], [a-z], [0-9]"
            error_message: "密码必须8-32位，包含大小写字母和数字"

        error_handling:
          - scenario: "Email already registered"
            code: "409"
            message: "该邮箱已被注册"
            action: "返回错误，建议登录或找回密码"
          - scenario: "Password does not meet requirements"
            code: "400"
            message: "密码不满足安全要求"
            action: "返回具体的不满足项"

      - id: AC2
        title: "User login with credentials"
        scenario:
          given: "User has an active account"
          when: "User submits valid credentials via POST /api/auth/login"
          then:
            - "JWT access token is generated (15 min expiry)"
            - "JWT refresh token is generated (7 day expiry)"
            - "Tokens are returned in response body"
            - "Last login timestamp is updated"

        business_rules:
          - id: "BR-2.1"
            rule: "Failed login attempts are tracked; lock account after 5 consecutive failures"
          - id: "BR-2.2"
            rule: "Account lockout duration is 15 minutes"
          - id: "BR-2.3"
            rule: "JWT access token contains: user_id, username, roles"

        data_validation:
          - field: "email"
            type: "email"
            required: true
            rules: "Valid email format"
            error_message: "请输入邮箱地址"
          - field: "password"
            type: "string"
            required: true
            rules: "Non-empty string"
            error_message: "请输入密码"

        error_handling:
          - scenario: "Invalid credentials"
            code: "401"
            message: "邮箱或密码错误"
            action: "不提示具体哪个字段错误，累计失败次数"
          - scenario: "Account locked"
            code: "423"
            message: "账户已锁定，请15分钟后再试"
            action: "返回剩余锁定时间"

      - id: AC3
        title: "Role-based access control (RBAC)"
        scenario:
          given: "User is authenticated with JWT token"
          when: "User attempts to access a resource without required role"
          then:
            - "Response returns 403 Forbidden"
            - "Response includes error message '权限不足'"

        business_rules:
          - id: "BR-3.1"
            rule: "System defines roles: admin, salesman, engineer, planner, buyer, warehouse_staff, qa, operator, finance, hr"
          - id: "BR-3.2"
            rule: "Each role has specific permissions (create/read/update/delete on specific modules)"
          - id: "BR-3.3"
            rule: "Admin has all permissions by default"

        error_handling:
          - scenario: "Token expired"
            code: "401"
            message: "登录已过期，请重新登录"
            action: "返回401，前端跳转登录页"
          - scenario: "Insufficient permissions"
            code: "403"
            message: "权限不足"
            action: "返回403，提示需要何种权限"

    provides_apis:
      - "POST /api/auth/register"
      - "POST /api/auth/login"
      - "POST /api/auth/refresh"
      - "GET /api/users/me"
    consumes_apis: []
    dependencies: []
    sm_hints:
      front_end_spec: null
      architecture:
        files:
          - "5-components.md#AuthService"
          - "8-database-schema.md#users"

  - id: "1.2"
    title: "System Service - Dictionary & Configuration"
    repository_type: monolith
    estimated_complexity: low
    priority: P0

    acceptance_criteria:
      - id: AC1
        title: "Dictionary CRUD operations"
        scenario:
          given: "Admin user is authenticated"
          when: "Admin creates a new dictionary entry via POST /api/dictionaries"
          then:
            - "Dictionary entry is created with code, name, value, sort order"
            - "Response returns 201 with created entry"
            - "Entry is available for all users"

        business_rules:
          - id: "BR-1.1"
            rule: "Dictionary code must be unique within category"
          - id: "BR-1.2"
            rule: "Category types include: customer_type, industry, order_status, production_status, quality_status, etc."

        data_validation:
          - field: "category"
            type: "string"
            required: true
            rules: "Non-empty string, max 50 chars"
            error_message: "请选择字典分类"
          - field: "code"
            type: "string"
            required: true
            rules: "Non-empty, alphanumeric with underscore, max 50 chars"
            error_message: "请输入有效的字典编码"
          - field: "name"
            type: "string"
            required: true
            rules: "Non-empty, max 100 chars"
            error_message: "请输入字典名称"

        error_handling:
          - scenario: "Duplicate code in same category"
            code: "409"
            message: "该分类下编码已存在"
            action: "返回409，建议使用其他编码"

    provides_apis:
      - "GET /api/dictionaries"
      - "POST /api/dictionaries"
      - "PUT /api/dictionaries/:id"
      - "DELETE /api/dictionaries/:id"
      - "GET /api/dictionaries/category/:category"
    consumes_apis: []
    dependencies: []
    sm_hints:
      front_end_spec: null
      architecture: null

  - id: "1.3"
    title: "System Service - Workflow Engine"
    repository_type: monolith
    estimated_complexity: high
    priority: P0

    acceptance_criteria:
      - id: AC1
        title: "Workflow definition and execution"
        scenario:
          given: "Admin defines a multi-step approval workflow"
          when: "User submits a record that triggers the workflow"
          then:
            - "Workflow instance is created with initial step"
            - "Approver is notified (in-app notification)"
            - "Record status is 'pending_approval'"
            - "After approval, record status updates and moves to next step"

        business_rules:
          - id: "BR-1.1"
            rule: "Workflow steps are sequential; each step must be approved before next"
          - id: "BR-1.2"
            rule: "Approver can approve, reject, or return for revision"
          - id: "BR-1.3"
            rule: "Rejected records return to submitter with rejection reason"

        data_validation:
          - field: "workflowDefinitionId"
            type: "string"
            required: true
            rules: "Valid UUID reference to workflow definition"
            error_message: "请选择工作流"
          - field: "recordId"
            type: "string"
            required: true
            rules: "Valid UUID reference to business record"
            error_message: "无效的业务记录"

        error_handling:
          - scenario: "Workflow definition not found"
            code: "404"
            message: "工作流定义不存在"
            action: "返回404，记录错误日志"

    provides_apis:
      - "POST /api/workflows/definitions"
      - "GET /api/workflows/definitions"
      - "POST /api/workflows/instances"
      - "GET /api/workflows/instances/:id"
      - "POST /api/workflows/instances/:id/approve"
      - "POST /api/workflows/instances/:id/reject"
    consumes_apis: []
    dependencies: ["1.1"]
    sm_hints:
      front_end_spec: null
      architecture: null

  - id: "1.4"
    title: "API Gateway - Routing & Authentication"
    repository_type: monolith
    estimated_complexity: medium
    priority: P0

    acceptance_criteria:
      - id: AC1
        title: "Gateway routes requests to backend services"
        scenario:
          given: "Request comes in at /api/*"
          when: "Gateway receives request with valid JWT token"
          then:
            - "Gateway validates JWT token"
            - "Gateway extracts user info and adds to request header"
            - "Gateway routes request to appropriate backend service"
            - "Response is passed back to client"

        business_rules:
          - id: "BR-1.1"
            rule: "Routes: /api/auth/* -> auth service, /api/sys/* -> system service, /api/biz/* -> main app"
          - id: "BR-1.2"
            rule: "All /api/* routes (except /api/auth/login, /api/auth/register) require valid JWT"
          - id: "BR-1.3"
            rule: "Gateway logs all requests with trace ID"

        error_handling:
          - scenario: "Invalid JWT token"
            code: "401"
            message: "未授权"
            action: "返回401，前端跳转登录"
          - scenario: "Backend service unavailable"
            code: "503"
            message: "服务暂时不可用"
            action: "返回503，记录错误日志，触发告警"

    provides_apis: []
    consumes_apis:
      - "POST /api/auth/login"
      - "POST /api/auth/register"
    dependencies: ["1.1"]
    sm_hints:
      front_end_spec: null
      architecture: null

  - id: "1.5"
    title: "Database Schema - Core Tables"
    repository_type: monolith
    estimated_complexity: medium
    priority: P0

    acceptance_criteria:
      - id: AC1
        title: "Core database tables created"
        scenario:
          given: "Database migration runs"
          when: "DDL scripts execute"
          then:
            - "Users table created with indexes"
            - "Roles and permissions tables created"
            - "Dictionaries table created with category index"
            - "Workflow definitions and instances tables created"
            - "Audit log table created"

        business_rules:
          - id: "BR-1.1"
            rule: "All tables have created_at, updated_at, created_by, updated_by fields"
          - id: "BR-1.2"
            rule: "Soft delete is implemented (deleted_at column)"
          - id: "BR-1.3"
            rule: "UUID used as primary key for all tables"

        error_handling:
          - scenario: "Migration fails due to constraint violation"
            code: "500"
            message: "数据库迁移失败"
            action: "返回500，回滚事务，记录错误日志"

    provides_apis: []
    consumes_apis: []
    dependencies: []
    sm_hints:
      front_end_spec: null
      architecture: null
